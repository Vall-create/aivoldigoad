<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121216">
<title>Halaman Raja</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#e8e8ec;--box:#f6f6f8;--ink:#121216;--acc:#6b4fd8;--accink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#101014;--box:#1a1a21;--ink:#ececf0;--acc:#a28cff;--accink:#121216}}
:root[data-theme="dark"]{--paper:#101014;--box:#1a1a21;--ink:#ececf0;--acc:#a28cff;--accink:#121216}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background-color:var(--paper);color:var(--ink);font:500 16px/1.65 "Zen Kaku Gothic New",system-ui,sans-serif}
#loader{--ink:#121216;--box:#f6f6f8;--acc:#6b4fd8;--accink:#fff;position:fixed;inset:0;z-index:50;display:grid;place-content:center;justify-items:center;gap:18px;background:#e8e8ec;color:#121216;clip-path:polygon(0 0,100% 0,100% 100%,0 100%);transition:clip-path .85s cubic-bezier(.7,0,.2,1),visibility 0s .85s}
#loader.done{clip-path:polygon(0 0,100% 0,100% 0,0 0);visibility:hidden;pointer-events:none}
.print{position:relative;isolation:isolate;width:max-content;height:1em;font:400 clamp(30px,11.4vw,64px)/1 "Dela Gothic One",Impact,sans-serif}
.print b{display:block;position:absolute;left:0;top:0;white-space:nowrap;font-weight:400;mix-blend-mode:multiply}
.print .c3{position:relative}
.c1{color:var(--acc);transform:translate(calc(var(--o,16)*-1px),calc(var(--o,16)*.6px))}
.c2{color:#a9abb8;transform:translate(calc(var(--o,16)*1px),calc(var(--o,16)*-.8px))}
.c3{color:#121216;transform:translate(0,calc(var(--o,16)*.5px))}
.rule{width:min(280px,72vw);height:3px;background:#121216;transform-origin:left;transform:scaleX(var(--p,0))}
#lp{margin:0;font-weight:700}
.btn{display:inline-block;appearance:none;font:700 16px/1.2 "Zen Kaku Gothic New",system-ui,sans-serif;color:var(--ink);background:var(--box);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:13px 22px;cursor:pointer;text-decoration:none;transition:transform .12s,box-shadow .12s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.red{background:var(--acc);color:var(--accink)}
.card{background:var(--box);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--acc);padding:18px}
h2{display:inline-block;margin:0 0 18px;padding:7px 14px 6px;background:var(--ink);color:var(--paper);font:400 22px/1.1 "Dela Gothic One",Impact,sans-serif;transform:rotate(-1.5deg)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
#pub{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
.hero{position:relative;flex:none;height:30%;min-height:170px;max-height:300px;margin-bottom:22px;opacity:0}
.art{position:absolute;inset:0;overflow:hidden;background:#9a9aa4;border-bottom:3px solid var(--ink)}
.art img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.hero h1{position:absolute;left:14px;bottom:-18px;max-width:82%;margin:0;padding:6px 14px 5px;overflow-wrap:anywhere;background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--acc);font:400 clamp(20px,6.4vw,28px)/1.1 "Dela Gothic One",Impact,sans-serif}
.mp{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--box);border-bottom:3px solid var(--ink)}
.hero h1{user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}.hero h1[data-pos=tengah]{left:50%;transform:translateX(-50%);text-align:center}.hero h1[data-pos=kanan]{left:auto;right:14px}.f select{display:block;width:100%;margin-top:4px;font:500 16px/1.5 "Zen Kaku Gothic New",system-ui,sans-serif;color:var(--ink);background:var(--paper);border:3px solid var(--ink);padding:9px 10px}.f input[type=range]{border:0;padding:6px 0;background:none}.mn{margin-top:10px;padding:12px!important;border:3px solid var(--ink)!important;background:var(--paper)}.mn b{font:400 14px/1 "Dela Gothic One",Impact,sans-serif;opacity:.7}
#mt{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp button{font:700 15px/1 "Zen Kaku Gothic New",system-ui,sans-serif;color:var(--ink);background:transparent;border:2px solid var(--ink);padding:9px 11px;cursor:pointer}
#cm{flex:1;min-height:0;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px;opacity:0}
.b{max-width:88%;padding:10px 14px;border:3px solid var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.b.a{align-self:flex-start;background:var(--box);border-radius:4px 18px 18px 18px}
.b.u{align-self:flex-end;background:var(--ink);color:var(--paper);border-radius:18px 4px 18px 18px}
.b.rich{width:100%;max-width:100%;white-space:normal}
.rich p{margin:0 0 10px}
.ks{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 0 0;padding:0;list-style:none}
.ks a{color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-color:var(--acc);text-decoration-thickness:3px;text-underline-offset:4px}
.pl{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.pl button{width:100%;text-align:left;font:700 16px/1.4 "Zen Kaku Gothic New",system-ui,sans-serif;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--ink);padding:12px 4px;cursor:pointer}
.pl button:hover{color:var(--acc)}
.kr{background:var(--box);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);margin:0 0 18px}
.kr img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-bottom:3px solid var(--ink)}
.kr div{padding:12px 14px 14px}
.kr h3{margin:0 0 6px;font:400 19px/1.2 "Dela Gothic One",Impact,sans-serif}
.kr p{margin:0 0 10px}
.kr a.btn{padding:9px 16px;font-size:15px}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gal figure{margin:0}
.gal img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border:3px solid var(--ink)}
.gal figcaption{font-size:14px;margin-top:4px}
#menu{flex:none;display:flex;flex-wrap:wrap;gap:10px 12px;padding:14px;background:var(--paper);border-top:3px solid var(--ink)}
#menu button{flex:1 1 40%;font:700 16px/1.2 "Zen Kaku Gothic New",system-ui,sans-serif;color:var(--ink);background:var(--box);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:12px 8px;cursor:pointer;transform:skewX(-8deg)}
#menu button span{display:block;transform:skewX(8deg)}
.ready .hero{animation:rise .7s both}
.ready #cm,.ready .cwrap{animation:rise .7s .25s both}
@keyframes rise{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
#adm main{max-width:520px;margin:0 auto;padding:26px 20px 40px}
.ah{margin:0 0 6px;font:400 32px/1.1 "Dela Gothic One",Impact,sans-serif}
.hint{margin:0 0 22px;opacity:.8}
.f{margin-bottom:26px}
.f h2{font-size:22px}
.f label{display:block;font-weight:700;margin:12px 0 0}
.f input,.f textarea{display:block;width:100%;margin-top:4px;font:500 16px/1.5 "Zen Kaku Gothic New",system-ui,sans-serif;color:var(--ink);background:var(--paper);border:3px solid var(--ink);padding:9px 10px}
.f input[type=file]{border:0;padding:6px 0;background:none}
.f input[type=color]{width:72px;height:44px;padding:2px}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.f ul{list-style:none;padding:0;margin:14px 0 0}
.f li{padding:12px 0;border-bottom:2px solid var(--ink);overflow-wrap:anywhere}
.rw{display:grid;gap:6px}
.ac{display:flex;gap:8px;margin:10px 0 0}
.ac button{font:700 14px/1 "Zen Kaku Gothic New",system-ui,sans-serif;color:var(--ink);background:transparent;border:2px solid var(--ink);padding:8px 12px;cursor:pointer}
.ac .x{margin-left:auto;color:var(--accink);background:var(--acc);border-color:var(--acc)}
.sb{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:var(--box);border-top:3px solid var(--ink)}
#am{flex:1;min-width:0;font-weight:700;min-height:1.65em}
@media (prefers-reduced-motion:reduce){#loader{transition:none}.ready .hero,.ready #cm,.ready .cwrap{animation:none;opacity:1}}
#pvw img{width:44px;height:44px;object-fit:cover;border:2px solid var(--ink)}
#pvw span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
#pvw button,.bx button{font:700 13px/1 "Zen Kaku Gothic New",system-ui,sans-serif;color:var(--ink);background:transparent;border:2px solid var(--ink);padding:7px 10px;cursor:pointer}
.b img{display:block;max-width:100%;max-height:200px;margin:0 0 8px;border:2px solid var(--ink)}
.bx{display:flex;gap:8px;margin:-6px 0 0}
.ann{flex:none;padding:8px 14px;background:var(--acc);color:var(--accink);font-weight:700;border-bottom:3px solid var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips .btn{padding:8px 12px;font-size:14px}
#lgs li{font-size:14px}

:root{--ink:#1f1e1d;--line:color-mix(in srgb,var(--ink) 15%,transparent);--ub:color-mix(in srgb,var(--ink) 7%,var(--paper));--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:"Source Serif 4",Georgia,serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#ece9e1}}
:root[data-theme="dark"]{--ink:#ece9e1}
body{font:400 16px/1.65 var(--sans)}
#pub{max-width:none;margin:0}
.top{flex:none;display:flex;align-items:center;gap:2px;padding:8px 10px}
.ic{width:42px;height:42px;display:grid;place-items:center;padding:0;border:0;border-radius:12px;background:transparent;color:var(--ink);cursor:pointer}
.ic:hover{background:var(--ub)}
.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tn{flex:1;min-width:0;text-align:center;font:600 17px/1 var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:none}
.hero{width:min(760px,calc(100% - 28px));margin:2px auto 12px;border-radius:22px;overflow:hidden;transition:height .35s ease,margin .35s ease}
.art{border:0}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6),transparent 60%);pointer-events:none}
.hero h1{left:20px;bottom:16px;max-width:86%;padding:0;border:0;box-shadow:none;background:none;color:#fff;font:600 30px/1.15 var(--serif);text-shadow:0 2px 16px rgba(0,0,0,.5);z-index:1}
.chatting .hero{height:0!important;margin:0!important}
#cm{padding:6px max(14px,calc((100% - 760px)/2)) 18px;gap:20px}
.b{max-width:100%;padding:0;border:0;background:none;border-radius:0}
.b.a{align-self:stretch;font:400 17px/1.72 var(--serif);color:var(--ink)}
.b.u{align-self:flex-end;max-width:85%;padding:10px 16px;background:var(--ub);border-radius:18px;font:400 16px/1.6 var(--sans);color:var(--ink)}
.b.rich{padding:14px 16px;background:var(--box);border:1px solid var(--line);border-radius:16px;font:400 16px/1.65 var(--sans)}
.b img{border:0;border-radius:12px}
.kr,.gal img{border:1px solid var(--line);box-shadow:none;border-radius:14px}
.kr img{border-bottom:1px solid var(--line)}
#pub .btn{border:1px solid var(--line);box-shadow:none;border-radius:12px;font-family:var(--sans)}
#pub .btn.red{border-color:transparent}
.pl{border-top:1px solid var(--line)}
.bx button,#pvw button,.ac button{border:1px solid var(--line);border-radius:8px}
.mp{width:min(760px,calc(100% - 28px));margin:0 auto 8px;border:1px solid var(--line);border-radius:14px}
.mp button{border:0;border-radius:8px}
.ann{border:0}
#menu{position:fixed;z-index:40;top:0;bottom:0;left:0;width:min(320px,86vw);flex-wrap:nowrap;flex-direction:column;gap:2px;padding:max(14px,env(safe-area-inset-top)) 12px 16px;overflow:auto;background:var(--paper);border:0;border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .28s ease}
.dr #menu{transform:none;box-shadow:8px 0 40px rgba(0,0,0,.18)}
#menu button{flex:none;width:100%;padding:10px 12px;border:0;border-radius:10px;background:transparent;box-shadow:none;transform:none;text-align:left;font:500 15px/1.3 var(--sans);color:var(--ink);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#menu button:hover{background:var(--ub)}
#menu button.nw{background:var(--ub);font-weight:600;margin-bottom:6px}
#menu button.hx{opacity:.6;font-size:13px}
#menu .dh{padding:6px 12px 14px;font:600 22px/1.2 var(--serif)}
#menu h3{margin:16px 12px 4px;font:600 13px/1.2 var(--sans);opacity:.6}
#menu p{margin:4px 12px;font-size:14px;opacity:.6}
#sc{position:fixed;inset:0;z-index:39;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .28s}
.dr #sc{opacity:1;pointer-events:auto}
@media (min-width:1000px){#menu{transform:none;box-shadow:none}#sc{display:none}#mb{display:none}#pub{padding-left:320px}}
@media (prefers-reduced-motion:reduce){#menu,#sc,.hero{transition:none}}
.b.md{white-space:normal}.md p{margin:0 0 .8em}.md p:last-child,.md ul:last-child,.md ol:last-child{margin-bottom:0}.md ul,.md ol{margin:0 0 .8em;padding-left:1.4em}.md li{margin:.2em 0}.md pre{overflow:auto;margin:0 0 .8em;padding:12px 14px;background:var(--ub);border-radius:12px;font:13.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre}.md code{padding:1px 5px;background:var(--ub);border-radius:6px;font:.88em ui-monospace,Menlo,Consolas,monospace}
.dt{display:inline-flex;gap:5px;padding:8px 0}.dt i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.35;animation:dp 1.1s infinite}.dt i:nth-child(2){animation-delay:.15s}.dt i:nth-child(3){animation-delay:.3s}@keyframes dp{50%{opacity:1;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.dt i{animation:none;opacity:.6}}
#adm .card{border:1px solid var(--line);box-shadow:none;border-radius:18px;padding:18px 18px 20px}
#adm h2{display:block;margin:0 0 14px;padding:0;background:none;color:var(--ink);transform:none;font:600 19px/1.2 var(--serif)}
#adm .ah{font:600 30px/1.15 var(--serif)}
#adm .f{margin-bottom:18px}
#adm .f label{font-weight:600;font-size:15px}
#adm .f input,#adm .f textarea,#adm .f select{border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:11px 12px}
#adm .f input[type=file],#adm .f input[type=range],#adm .f input[type=checkbox]{border:0;padding:6px 0;background:none}
#adm .f input[type=color]{padding:2px;width:72px;height:44px}
#adm .f li{border-bottom:1px solid var(--line)}
#adm .ac button,#adm .btn,#adm #bk{border:1px solid var(--line);border-radius:10px;box-shadow:none;background:var(--box);color:var(--ink);padding:9px 14px;font-family:var(--sans)}
#adm .btn.red,#adm .ac .x,#adm .ac .btn.red{background:var(--acc);color:var(--accink);border-color:transparent}
#adm .mn{border:1px solid var(--line)!important;border-radius:14px;padding:14px!important}
#adm .sb{border-top:1px solid var(--line)}
#adm #ks{font-weight:600}

/* === komposer ala Claude === */
.cwrap{flex:none;width:min(760px,calc(100% - 24px));margin:0 auto;padding:0 0 max(8px,env(safe-area-inset-bottom));opacity:0}
#pvw{display:flex;align-items:center;gap:10px;margin:0 6px 8px;padding:8px 10px;background:var(--box);border:1px solid var(--line);border-radius:14px}
.cbar{display:block;background:var(--box);border:1px solid var(--line);border-radius:24px;box-shadow:0 2px 20px rgba(0,0,0,.07);padding:10px 10px 8px 14px;transition:box-shadow .2s,border-color .2s}
.cbar:focus-within{border-color:color-mix(in srgb,var(--ink) 30%,transparent);box-shadow:0 4px 28px rgba(0,0,0,.12)}
#ci{display:block;width:100%;max-height:200px;resize:none;border:0;outline:0!important;background:transparent;color:var(--ink);font:400 16px/1.55 var(--sans);padding:6px 4px 8px;margin:0}
#ci::placeholder{color:color-mix(in srgb,var(--ink) 50%,transparent)}
.crow{display:flex;align-items:center;justify-content:space-between}
.cl,.cr{display:flex;align-items:center;gap:2px}
.cbar .ib{display:grid;place-items:center;width:38px;height:38px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--ink);cursor:pointer}
.cbar .ib:hover{background:var(--ub)}
.cbar .ib svg,#cs svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#cs{display:grid;place-items:center;width:36px;height:36px;padding:0;border:0;border-radius:50%;background:var(--acc);color:var(--accink);cursor:pointer;transition:opacity .15s,transform .1s}
#cs:disabled{opacity:.35;cursor:default}
#cs:not(:disabled):active{transform:scale(.92)}
.fine{margin:8px 0 2px;text-align:center;font:400 12px/1.4 var(--sans);opacity:.55}
.bx{display:flex;gap:2px;margin:-10px 0 0}
.bx button{display:grid;place-items:center;width:32px;height:32px;padding:0;border:0;border-radius:8px;background:transparent;color:var(--ink);opacity:.6;cursor:pointer}
.bx button:hover{opacity:1;background:var(--ub)}
.bx svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#pub .chips .btn{border-radius:999px;background:transparent;font:400 14px/1.2 var(--sans);padding:8px 14px}
#pub .chips .btn:hover{background:var(--ub)}
#mb{color:var(--ink)}
@supports(height:100dvh){html,body,#pub{height:100dvh}}
</style>
</head>
<body>
<div id="loader" role="status" aria-label="Halaman sedang dimuat">
<div class="print" aria-hidden="true"><b class="c1"></b><b class="c2"></b><b class="c3"></b></div>
<div class="rule" aria-hidden="true"></div>
<p id="lp" aria-hidden="true"><span id="ls"></span><span id="pct">0</span>%</p>
<button class="btn red" id="go" hidden></button>
</div>
